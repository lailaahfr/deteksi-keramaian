# Konfigurasi deploy otomatis di Render (render.com) - dibaca lewat menu New > Blueprint
services:
  - type: web
    name: penjaga-tenang-lab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    # 1 worker karena sesi mikrofon disimpan di memori; 8 thread untuk melayani beberapa tab
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: NUMBA_CACHE_DIR
        value: /tmp/numba
